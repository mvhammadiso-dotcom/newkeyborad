
name: Build MROS Keyboard APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract ZIP
        run: |
          mkdir -p project
          unzip -o mros-keyboard-complete.zip -d project
          ls -la project

      - name: Locate Android project
        run: |
          find project -name settings.gradle.kts
          test -f project/mros-keyboard/settings.gradle.kts

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle Wrapper
        working-directory: project/mros-keyboard
        run: gradle wrapper

      - name: Build APK
        working-directory: project/mros-keyboard
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MROS-Keyboard-APK
          path: project/mros-keyboard/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
